  <style>
    /* ── Reset & base ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0A0F0D;
      --surface:     #1A2E1F;
      --surface-2:   #243828;
      --border:      #2D4A32;
      --text:        #E8F5E0;
      --text-muted:  #7DA882;
      --accent:      #4CAF50;

      /* AQI colour scale */
      --aqi-good:      #4CAF50;
      --aqi-satisf:    #8BC34A;
      --aqi-moderate:  #FFC107;
      --aqi-poor:      #FF5722;
      --aqi-verypoor:  #F44336;
      --aqi-severe:    #B71C1C;

      --nav-h: 56px;
      --card-w: 280px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Nav ────────────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: var(--nav-h);
      background: rgba(10, 15, 13, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .wordmark {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
      text-decoration: none;
    }

    .wordmark span { color: var(--accent); }

    .tabs {
      display: flex;
      gap: 4px;
    }

    .tabs a {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      transition: background 0.15s, color 0.15s;
      color: var(--text-muted);
    }

    .tabs a.active {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .tabs a:not(.active):hover {
      color: var(--text);
    }

    .tabs a.dimmed {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }

    /* ── Map container ──────────────────────────────────────────────── */
    #map {
      position: fixed;
      top: var(--nav-h);
      left: 0; right: 0; bottom: 0;
    }

    /* MapLibre attribution */
    .maplibregl-ctrl-attrib { font-size: 10px !important; }
    .maplibregl-ctrl-bottom-right { bottom: 4px !important; }

    /* ── Popup ──────────────────────────────────────────────────────── */
    .maplibregl-popup-content {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      padding: 16px !important;
      min-width: 200px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
    }

    .maplibregl-popup-tip {
      border-top-color: var(--surface) !important;
      border-bottom-color: var(--surface) !important;
    }

    .maplibregl-popup-close-button {
      color: var(--text-muted) !important;
      font-size: 18px !important;
      top: 8px !important;
      right: 10px !important;
    }

    .popup-city {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .popup-aqi-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .popup-aqi-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
    }

    .popup-aqi-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .popup-verdict {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .popup-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 2px;
    }

    .popup-meta span { display: flex; gap: 4px; }
    .popup-meta strong { color: var(--text); }

    /* ── Nearest station card (bottom-left) ─────────────────────────── */
    #nearest-card {
      position: fixed;
      bottom: 24px;
      left: 20px;
      z-index: 90;
      width: var(--card-w);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transition: transform 0.3s, opacity 0.3s;
    }

    #nearest-card.hidden {
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
    }

    .card-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .card-city {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-aqi-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }

    .card-aqi-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
    }

    .card-aqi-unit {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-verdict {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .card-pollutant {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .card-updated {
      font-size: 10px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    /* ── Legend ─────────────────────────────────────────────────────── */
    #legend {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 90;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .legend-title {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 11px;
      color: var(--text);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Loading / error overlays ───────────────────────────────────── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s;
    }

    #loading-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    #error-banner {
      position: fixed;
      top: calc(var(--nav-h) + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      background: #2D1A1A;
      border: 1px solid #5C2020;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      color: #FF8A80;
      max-width: 480px;
      text-align: center;
      display: none;
    }

    /* ── Mobile / responsive ────────────────────────────────────────── */
    @media (max-width: 600px) {
      :root { --card-w: calc(100vw - 40px); }

      #nearest-card {
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        border-radius: 16px 16px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        padding: 18px 20px 28px;
      }

      #legend {
        bottom: calc(180px + 24px); /* above the bottom sheet */
        right: 12px;
      }

      .card-aqi-num { font-size: 44px; }
    }
  </style>

  if (aqi <= 50)  return '#4CAF50';

  if (aqi <= 300) return '#FF5722';

  'Vijayawada':[16.5062,80.6480],'Visakhapatnam':[17.6868,83.2185],
  'Vrindavan':[27.5794,77.6964],'Yamunanagar':[30.1290,77.2674],
};

/* ── CPCB AQI breakpoints → compute sub-index from concentration ─── */
const AQI_BREAKPOINTS = {
  'PM2.5': [[0,30,0,50],[31,60,51,100],[61,90,101,200],[91,120,201,300],[121,250,301,400],[251,500,401,500]],
  'PM10':  [[0,50,0,50],[51,100,51,100],[101,250,101,200],[251,350,201,300],[351,430,301,400],[431,600,401,500]],
  'NO2':   [[0,40,0,50],[41,80,51,100],[81,180,101,200],[181,280,201,300],[281,400,301,400],[401,800,401,500]],
  'SO2':   [[0,40,0,50],[41,80,51,100],[81,380,101,200],[381,800,201,300],[801,1600,301,400],[1601,2620,401,500]],
  'CO':    [[0,1,0,50],[1.1,2,51,100],[2.1,10,101,200],[10.1,17,201,300],[17.1,34,301,400],[34.1,50,401,500]],
  'O3':    [[0,50,0,50],[51,100,51,100],[101,168,101,200],[169,208,201,300],[209,748,301,400],[749,1000,401,500]],
  'NH3':   [[0,200,0,50],[201,400,51,100],[401,800,101,200],[801,1200,201,300],[1201,1800,301,400],[1801,2400,401,500]],
  'Pb':    [[0,0.5,0,50],[0.51,1,51,100],[1.1,2,101,200],[2.1,3,201,300],[3.1,3.5,301,400],[3.51,5,401,500]],
};

function computeAQI(pollutantId, concentration) {
  const c = parseFloat(concentration);
  if (isNaN(c) || c < 0) return null;
  const bps = AQI_BREAKPOINTS[pollutantId];
  if (!bps) return null;
  for (const [cLo, cHi, iLo, iHi] of bps) {
    if (c <= cHi) return Math.round(((iHi - iLo) / (cHi - cLo)) * (c - cLo) + iLo);
  }
  return 500;
}

/* ── Parse CPCB API response into station objects ────────────────── */
/* Actual API fields (confirmed): country, state, city, station,
   last_update, latitude, longitude, pollutant_id, min_value,
   max_value, avg_value                                              */
function parseApiRecords(records) {
  /* Per-pollutant dataset — aggregate by station, keep highest AQI. */
  const byStation = new Map();

  records.forEach(r => {
    const city    = r.city    || '';
    const station = r.station || city;
    if (!city) return;

    // Coordinates from API (present in real data); fall back to lookup
    let lat = parseFloat(r.latitude);
    let lng = parseFloat(r.longitude);
    if (isNaN(lat) || isNaN(lng)) {
      const coords = CITY_COORDS[city] || CITY_COORDS[station];
      if (!coords) return;
      [lat, lng] = coords;
    }

    const pollutantId = (r.pollutant_id || '').trim();
    // avg_value is the raw concentration; compute AQI sub-index
    const aqi = computeAQI(pollutantId, r.avg_value);
    if (!aqi || aqi <= 0) return;

    const key      = `${city}||${station}`;
    const existing = byStation.get(key);
    // CPCB composite AQI = highest sub-index across all pollutants
    if (!existing || aqi > existing.aqi) {
      byStation.set(key, {
        city, station, lat, lng, aqi,
        pollutant: pollutantId || '—',
        updated:   r.last_update || '',
      });
    }
  });

  return Array.from(byStation.values());
}

/* ── Fetch live CPCB data (all pages) ────────────────────────────── */
async function fetchCPCBData() {
  const params = new URLSearchParams({ 'api-key': CPCB_API_KEY, format: 'json', limit: API_PAGE_LIMIT, offset: 0 });
  const res = await fetch(`${CPCB_API_URL}?${params}`);
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const json = await res.json();
  console.log('[vatavaran] API response keys:', Object.keys(json));
  // data.gov.in may use 'records', 'data', or 'result' depending on the resource
  let records = json.records || json.data || json.result || [];
  const total = parseInt(json.total) || records.length;
  if (total > API_PAGE_LIMIT) {
    const pages = Math.ceil(total / API_PAGE_LIMIT);
    const fetches = [];
    for (let p = 1; p < pages; p++) {
      const pg = new URLSearchParams({ 'api-key': CPCB_API_KEY, format: 'json', limit: API_PAGE_LIMIT, offset: p * API_PAGE_LIMIT });
      fetches.push(fetch(`${CPCB_API_URL}?${pg}`).then(r => r.json()).then(j => j.records || []));
    }
    (await Promise.all(fetches)).forEach(r => records.push(...r));
  }
  return parseApiRecords(records);
}

/* ── Haversine distance (km) ─────────────────────────────────────── */
function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ── Build GeoJSON FeatureCollection ────────────────────────────── */
function buildGeoJSON(stations, nearestIdx) {
  return {
    type: 'FeatureCollection',
    features: stations.map((s, i) => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [s.lng, s.lat] },
      properties: {
        city:      s.city,
        station:   s.station,
        aqi:       s.aqi,
        pollutant: s.pollutant,
        updated:   s.updated,
        color:     aqiColor(s.aqi),
        nearest:   i === nearestIdx,
        label:     String(s.aqi > 999 ? '999+' : s.aqi),
      },
    })),
  };
}

/* ── Build popup HTML ────────────────────────────────────────────── */
function buildPopupHTML(p) {
  const color   = aqiColor(p.aqi);
  const verdict = aqiVerdict(p.aqi);
  const name    = p.station && p.station !== p.city ? `${p.city} · ${p.station}` : p.city;
  return `
    <div class="popup-city">${name}</div>
    <div class="popup-aqi-row">
      <span class="popup-aqi-val" style="color:${color}">${p.aqi}</span>
      <span class="popup-aqi-label">AQI</span>
    </div>
    <div class="popup-verdict" style="color:${color}">${verdict}</div>
    <div class="popup-meta">
      <span><strong>Pollutant&nbsp;</strong>${p.pollutant}</span>
      ${p.updated ? `<span><strong>Updated&nbsp;</strong>${p.updated}</span>` : ''}
    </div>`;
}

/* ── Update nearest-station card ─────────────────────────────────── */
function updateCard(s) {
  const color = aqiColor(s.aqi);
  document.getElementById('card-city').textContent      = s.station && s.station !== s.city ? `${s.city} · ${s.station}` : s.city;
  document.getElementById('card-aqi').textContent       = s.aqi;
  document.getElementById('card-aqi').style.color       = color;
  document.getElementById('card-verdict').textContent   = aqiVerdict(s.aqi);
  document.getElementById('card-verdict').style.color   = color;
  document.getElementById('card-pollutant').textContent = s.pollutant ? `Dominant pollutant: ${s.pollutant}` : '';
  document.getElementById('card-updated').textContent   = s.updated   ? `Updated ${s.updated}` : '';
  document.getElementById('nearest-card').classList.remove('hidden');
}

/* ── Utility: show error/info banner ────────────────────────────── */
function showBanner(msg, type = 'error') {
  const banner = document.getElementById('error-banner');
  banner.textContent = msg;
  banner.style.display = 'block';
  if (type === 'info') {
    banner.style.background  = '#1A2E1F';
    banner.style.borderColor = '#2D4A32';
    banner.style.color       = '#7DA882';
  }
  setTimeout(() => { banner.style.display = 'none'; }, 8000);
}

/* ── Main init ───────────────────────────────────────────────────── */
(async function init() {

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxzoom: 19,
        },
      },
      layers: [{
        id: 'osm-tiles',
        type: 'raster',
        source: 'osm',
        paint: {
          'raster-brightness-min': 0,
          'raster-brightness-max': 0.25,
          'raster-saturation': -0.6,
          'raster-contrast': 0.2,
        },
      }],
    },
    /* Fit to India's bounding box on load */
    bounds: [[68.1, 6.5], [97.4, 37.1]],
    fitBoundsOptions: { padding: 20 },
    /* Restrict panning so the user stays on India */
    maxBounds: [[55, 1], [108, 42]],
    minZoom: 4,
    maxZoom: 14,
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: false,
  }), 'top-right');

  /* Fetch data + wait for map load in parallel */
  const usingDemo = CPCB_API_KEY === 'YOUR_API_KEY_HERE';
  let stations = [];

  const [fetchedStations] = await Promise.all([
    (async () => {
      try {
        if (usingDemo) {
          showBanner('Demo mode: showing sample data. Add your data.gov.in API key for live readings.', 'info');
          return DEMO_STATIONS;
        }
        const s = await fetchCPCBData();
        if (s.length === 0) throw new Error('No records returned by API');
        return s;
      } catch (err) {
        console.error('CPCB fetch failed:', err);
        showBanner(`Could not load live data (${err.message}). Showing demo markers.`);
        return DEMO_STATIONS;
      }
    })(),
    new Promise(resolve => map.once('load', resolve)),
  ]);

  stations = fetchedStations;

  /* ── Add GeoJSON source + layers (GPU-rendered — no jitter on pan) */
  map.addSource('stations', {
    type: 'geojson',
    data: buildGeoJSON(stations, -1), // -1 = no nearest highlighted yet
  });

  /* Regular circles */
  map.addLayer({
    id: 'aqi-circles',
    type: 'circle',
    source: 'stations',
    filter: ['!=', ['get', 'nearest'], true],
    paint: {
      'circle-radius':        ['interpolate', ['linear'], ['zoom'], 4, 9, 10, 17],
      'circle-color':         ['get', 'color'],
      'circle-stroke-color':  'rgba(255,255,255,0.25)',
      'circle-stroke-width':  1.5,
      'circle-opacity':       0.9,
    },
  });

  /* Nearest station — larger, white border */
  map.addLayer({
    id: 'aqi-nearest',
    type: 'circle',
    source: 'stations',
    filter: ['==', ['get', 'nearest'], true],
    paint: {
      'circle-radius':        ['interpolate', ['linear'], ['zoom'], 4, 13, 10, 23],
      'circle-color':         ['get', 'color'],
      'circle-stroke-color':  '#ffffff',
      'circle-stroke-width':  3,
      'circle-opacity':       1,
    },
  });

  /* AQI number labels on top */
  map.addLayer({
    id: 'aqi-labels',
    type: 'symbol',
    source: 'stations',
    layout: {
      'text-field':              ['get', 'label'],
      'text-font':               ['Open Sans Bold', 'Arial Unicode MS Bold'],
      'text-size':               ['interpolate', ['linear'], ['zoom'], 4, 8, 10, 11],
      'text-allow-overlap':      true,
      'text-ignore-placement':   true,
    },
    paint: {
      'text-color': '#ffffff',
    },
  });

  /* Click → popup */
  const popup = new maplibregl.Popup({ closeButton: true, maxWidth: '260px', offset: 4 });

  ['aqi-circles', 'aqi-nearest'].forEach(id => {
    map.on('click', id, e => {
      popup
        .setLngLat(e.features[0].geometry.coordinates.slice())
        .setHTML(buildPopupHTML(e.features[0].properties))
        .addTo(map);
    });
    map.on('mouseenter', id, () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', id, () => { map.getCanvas().style.cursor = ''; });
  });

  /* ── Nearest station detection ─────────────────────────────────── */
  let nearestIdx = -1;

  function findNearest(userLat, userLng) {
    if (stations.length === 0) return;
    let bestIdx = 0, bestDist = Infinity;
    stations.forEach((s, i) => {
      const d = distKm(userLat, userLng, s.lat, s.lng);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    });
    nearestIdx = bestIdx;
    map.getSource('stations').setData(buildGeoJSON(stations, nearestIdx));
    updateCard(stations[nearestIdx]);
  }

  if ('geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition(
      pos  => findNearest(pos.coords.latitude, pos.coords.longitude),
      _err => findNearest(28.6, 77.2), // default: Delhi
      { timeout: 5000 }
    );
  } else {
    findNearest(28.6, 77.2);
  }

  /* Hide loading overlay */
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('fade-out');
  setTimeout(() => overlay.style.display = 'none', 500);

})();
</script>
