/* ── AQI helpers ── */
function aqiColor(aqi) {
  if (aqi <= 50)  return '#4CAF50';
  if (aqi <= 100) return '#8BC34A';
  if (aqi <= 200) return '#FFC107';
  if (aqi <= 300) return '#FF5722';
  if (aqi <= 400) return '#F44336';
  return '#B71C1C';
}

function aqiVerdict(aqi) {
  if (aqi <= 50)  return 'Good';
  if (aqi <= 100) return 'Satisfactory';
  if (aqi <= 200) return 'Moderate';
  if (aqi <= 300) return 'Poor';
  if (aqi <= 400) return 'Very Poor';
  return 'Severe';
}

/* ── CPCB AQI breakpoints (concentration → sub-index) ── */
const AQI_BREAKPOINTS = {
  'PM2.5': [[0,30,0,50],[31,60,51,100],[61,90,101,200],[91,120,201,300],[121,250,301,400],[251,500,401,500]],
  'PM10':  [[0,50,0,50],[51,100,51,100],[101,250,101,200],[251,350,201,300],[351,430,301,400],[431,600,401,500]],
  'NO2':   [[0,40,0,50],[41,80,51,100],[81,180,101,200],[181,280,201,300],[281,400,301,400],[401,800,401,500]],
  'SO2':   [[0,40,0,50],[41,80,51,100],[81,380,101,200],[381,800,201,300],[801,1600,301,400],[1601,2620,401,500]],
  'CO':    [[0,1,0,50],[1.1,2,51,100],[2.1,10,101,200],[10.1,17,201,300],[17.1,34,301,400],[34.1,50,401,500]],
  'O3':    [[0,50,0,50],[51,100,51,100],[101,168,101,200],[169,208,201,300],[209,748,301,400],[749,1000,401,500]],
  'NH3':   [[0,200,0,50],[201,400,51,100],[401,800,101,200],[801,1200,201,300],[1201,1800,301,400],[1801,2400,401,500]],
  'Pb':    [[0,0.5,0,50],[0.51,1,51,100],[1.1,2,101,200],[2.1,3,201,300],[3.1,3.5,301,400],[3.51,5,401,500]],
};

function computeAQI(pollutantId, concentration) {
  const c = parseFloat(concentration);
  if (isNaN(c) || c < 0) return null;
  const bps = AQI_BREAKPOINTS[pollutantId];
  if (!bps) return null;
  for (const [cLo, cHi, iLo, iHi] of bps) {
    if (c <= cHi) return Math.round(((iHi - iLo) / (cHi - cLo)) * (c - cLo) + iLo);
  }
  return 500;
}

/* ── Parse API records: prefer PM2.5, fallback PM10 ── */
function parseApiRecords(records) {
  const byStation = new Map();

  records.forEach(r => {
    const city    = (r.city    || '').trim();
    const station = (r.station || city).trim();
    const state   = (r.state   || '').trim();
    if (!city) return;

    let lat = parseFloat(r.latitude);
    let lng = parseFloat(r.longitude);
    if (isNaN(lat) || isNaN(lng)) {
      const coords = CITY_COORDS[city] || CITY_COORDS[station];
      if (!coords) return;
      [lat, lng] = coords;
    }

    const pollutantId = (r.pollutant_id || '').trim();
    const avgValue    = r.avg_value;

    /* Skip NA or missing */
    if (avgValue === 'NA' || avgValue === null || avgValue === undefined) return;
    if (String(avgValue).trim().toUpperCase() === 'NA') return;

    const aqi = computeAQI(pollutantId, avgValue);
    if (!aqi || aqi <= 0) return;

    const key = `${city}||${station}`;
    const existing = byStation.get(key);

    if (!existing) {
      byStation.set(key, { city, station, state, lat, lng, aqi, pollutant: pollutantId, updated: r.last_update || '' });
    } else {
      /* PM2.5 > PM10 > others; within same priority, take higher AQI */
      const priority = p => p === 'PM2.5' ? 2 : p === 'PM10' ? 1 : 0;
      const existPri = priority(existing.pollutant);
      const newPri   = priority(pollutantId);
      if (newPri > existPri || (newPri === existPri && aqi > existing.aqi)) {
        byStation.set(key, { city, station, state, lat, lng, aqi, pollutant: pollutantId, updated: r.last_update || '' });
      }
    }
  });

  return Array.from(byStation.values());
}

/* ── Fetch live CPCB data (paginated) ── */
async function fetchCPCBData() {
  const params = new URLSearchParams({ 'api-key': CPCB_API_KEY, format: 'json', limit: API_PAGE_LIMIT, offset: 0 });
  const res = await fetch(`${CPCB_API_URL}?${params}`);
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const json = await res.json();
  let records = json.records || json.data || json.result || [];
  const total = parseInt(json.total) || records.length;
  if (total > API_PAGE_LIMIT) {
    const pages = Math.ceil(total / API_PAGE_LIMIT);
    const fetches = [];
    for (let p = 1; p < pages; p++) {
      const pg = new URLSearchParams({ 'api-key': CPCB_API_KEY, format: 'json', limit: API_PAGE_LIMIT, offset: p * API_PAGE_LIMIT });
      fetches.push(fetch(`${CPCB_API_URL}?${pg}`).then(r => r.json()).then(j => j.records || j.data || []));
    }
    (await Promise.all(fetches)).forEach(r => records.push(...r));
  }
  return parseApiRecords(records);
}

/* ── Stats bar ── */
function updateStats(stations) {
  if (stations.length === 0) return;
  const sorted = [...stations].sort((a, b) => b.aqi - a.aqi);
  const worst  = sorted[0];
  const best   = sorted[sorted.length - 1];

  document.getElementById('stat-count').innerHTML =
    `<span class="pill-num">${stations.length}</span>&nbsp;stations reporting`;

  document.getElementById('stat-worst').innerHTML =
    `Worst:&nbsp;<span class="pill-num" style="color:${aqiColor(worst.aqi)}">${worst.city} · ${worst.aqi}</span>`;

  document.getElementById('stat-best').innerHTML =
    `Best:&nbsp;<span class="pill-num" style="color:${aqiColor(best.aqi)}">${best.city} · ${best.aqi}</span>`;
}

/* ── Popup HTML ── */
function buildPopupHTML(s) {
  const color   = aqiColor(s.aqi);
  const verdict = aqiVerdict(s.aqi);
  const name    = (s.station && s.station !== s.city) ? `${s.city} · ${s.station}` : s.city;
  return `<div class="popup-inner">
    <div class="popup-city">${name}</div>
    <div class="popup-aqi-row">
      <span class="popup-aqi-val" style="color:${color}">${s.aqi}</span>
      <span class="popup-aqi-label">AQI</span>
    </div>
    <div class="popup-verdict" style="color:${color}">Air is ${verdict}</div>
    <div class="popup-meta">
      <span><strong>Pollutant&nbsp;</strong>${s.pollutant}</span>
      ${s.updated ? `<span><strong>Updated&nbsp;</strong>${s.updated}</span>` : ''}
    </div>
  </div>`;
}

/* ── Error banner ── */
function showBanner(msg, type = 'error') {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = 'block';
  if (type === 'info') {
    el.style.background  = '#1A2E1F';
    el.style.borderColor = '#2D4A32';
    el.style.color       = '#7DA882';
  } else {
    el.style.background  = '#2D1A1A';
    el.style.borderColor = '#5C2020';
    el.style.color       = '#FF8A80';
  }
  setTimeout(() => { el.style.display = 'none'; }, 8000);
}

/* ── Main ── */
(async function init() {

  /* Init Leaflet */
  const map = L.map('map', {
    center: [22.5, 82.9],
    zoom: 5,
    minZoom: 4,
    maxZoom: 14,
    maxBounds: [[4, 64], [40, 100]],
    maxBoundsViscosity: 1.0,
    zoomControl: true,
  });

  L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 20,
  }).addTo(map);

  map.fitBounds([[6.5, 68.1], [37.1, 97.4]], { padding: [24, 24] });

  /* Fetch data + state GeoJSON in parallel */
  const usingDemo = CPCB_API_KEY === 'YOUR_API_KEY_HERE';

  const [fetchedStations, stateGeojson] = await Promise.all([
    (async () => {
      try {
        if (usingDemo) {
          showBanner('Demo mode — add your data.gov.in API key for live readings.', 'info');
          return DEMO_STATIONS;
        }
        const s = await fetchCPCBData();
        if (s.length === 0) throw new Error('No records returned by API');
        return s;
      } catch (err) {
        console.error('[vatavaran] CPCB fetch failed:', err);
        showBanner(`Could not load live data (${err.message}). Showing demo markers.`);
        return DEMO_STATIONS;
      }
    })(),
    fetch('https://raw.githubusercontent.com/geohacker/india/master/state/india_state.geojson')
      .then(r => r.ok ? r.json() : null)
      .catch(() => null),
  ]);

  let stations = fetchedStations;

  /* ── State overlay ── */
  const stateBoundsMap = {}; /* normalized state name → L.LatLngBounds */

  function normStateName(s) { return (s || '').toLowerCase().trim(); }

  function getStateNameFromFeature(f) {
    return f.properties.NAME_1 || f.properties.name || f.properties.State || f.properties.ST_NM || '';
  }

  if (stateGeojson) {
    /* Avg AQI per state (keyed by normalized API state name) */
    const stateSum = {}, stateCount = {};
    stations.forEach(s => {
      if (!s.state) return;
      const k = normStateName(s.state);
      stateSum[k]   = (stateSum[k]   || 0) + s.aqi;
      stateCount[k] = (stateCount[k] || 0) + 1;
    });

    L.geoJSON(stateGeojson, {
      style: feature => {
        const name = getStateNameFromFeature(feature);
        const avg  = stateSum[normStateName(name)]
          ? Math.round(stateSum[normStateName(name)] / stateCount[normStateName(name)])
          : null;
        return {
          fillColor:   avg ? aqiColor(avg) : 'transparent',
          fillOpacity: avg ? 0.25 : 0,
          color:       '#2D4A32',
          weight:      0.8,
          opacity:     0.5,
        };
      },
      onEachFeature: (feature, layer) => {
        const geoName = getStateNameFromFeature(feature);
        const normKey = normStateName(geoName);

        /* Store bounds for filter panel (keyed by normalized GeoJSON name) */
        stateBoundsMap[normKey] = layer.getBounds();

        const avg = stateSum[normKey]
          ? Math.round(stateSum[normKey] / stateCount[normKey])
          : null;

        if (avg) {
          layer.bindTooltip(
            `${geoName} &middot; Avg AQI ${avg} &middot; ${aqiVerdict(avg)}`,
            { sticky: true, className: 'state-tooltip' }
          );
          layer.on('mouseover', () => layer.setStyle({ fillOpacity: 0.45 }));
          layer.on('mouseout',  () => layer.setStyle({ fillOpacity: 0.25 }));
        }
      },
    }).addTo(map);
  }

  /* ── Station markers ── */
  let markerLayer = L.layerGroup().addTo(map);

  function renderMarkers(list) {
    markerLayer.clearLayers();
    list.forEach(s => {
      const circle = L.circleMarker([s.lat, s.lng], {
        radius:      9,
        fillColor:   aqiColor(s.aqi),
        color:       'rgba(255,255,255,0.3)',
        weight:      1.5,
        fillOpacity: 0.92,
      });
      circle.bindPopup(buildPopupHTML(s), { maxWidth: 260 });
      markerLayer.addLayer(circle);
    });
  }

  renderMarkers(stations);
  updateStats(stations);

  /* ── Filter panel ── */
  const panel       = document.getElementById('filter-panel');
  const strip       = document.getElementById('filter-strip');
  const stateSelect = document.getElementById('filter-state');
  const citySelect  = document.getElementById('filter-city');
  const resetEl     = document.getElementById('filter-reset');

  /* Populate state dropdown */
  const stateSet = new Set(stations.map(s => s.state).filter(Boolean));
  [...stateSet].sort().forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    stateSelect.appendChild(opt);
  });

  /* Cities grouped by state */
  const citiesByState = {};
  stations.forEach(s => {
    if (!s.state || !s.city) return;
    if (!citiesByState[s.state]) citiesByState[s.state] = new Set();
    citiesByState[s.state].add(s.city);
  });

  function rebuildCitySelect(stateName) {
    citySelect.innerHTML = '<option value="">All Cities</option>';
    if (!stateName) return;
    const cities = citiesByState[stateName];
    if (!cities) return;
    [...cities].sort().forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      citySelect.appendChild(opt);
    });
  }

  strip.addEventListener('click', () => panel.classList.toggle('expanded'));

  stateSelect.addEventListener('change', () => {
    const stateName = stateSelect.value;
    rebuildCitySelect(stateName);
    citySelect.value = '';

    const filtered = stateName ? stations.filter(s => s.state === stateName) : stations;
    renderMarkers(filtered);

    if (stateName) {
      const bounds = stateBoundsMap[normStateName(stateName)];
      if (bounds && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [40, 40] });
      } else if (filtered.length > 0) {
        map.fitBounds(filtered.map(s => [s.lat, s.lng]), { padding: [60, 60] });
      }
    } else {
      map.fitBounds([[6.5, 68.1], [37.1, 97.4]], { padding: [24, 24] });
    }
  });

  citySelect.addEventListener('change', () => {
    const cityName  = citySelect.value;
    const stateName = stateSelect.value;
    let filtered = stateName ? stations.filter(s => s.state === stateName) : stations;

    if (cityName) {
      filtered = filtered.filter(s => s.city === cityName);
      if (filtered.length > 0) map.setView([filtered[0].lat, filtered[0].lng], 12);
    }
    renderMarkers(filtered);
  });

  resetEl.addEventListener('click', () => {
    stateSelect.value = '';
    rebuildCitySelect('');
    renderMarkers(stations);
    map.fitBounds([[6.5, 68.1], [37.1, 97.4]], { padding: [24, 24] });
  });

  /* Hide loading */
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('fade-out');
  setTimeout(() => { overlay.style.display = 'none'; }, 500);

})();
</script>
