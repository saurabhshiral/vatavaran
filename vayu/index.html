/* ── AQI colour + verdict helpers ───────────────────────────────── */
function aqiColor(aqi) {
  if (aqi <= 50)  return '#4CAF50';
  if (aqi <= 100) return '#8BC34A';
  if (aqi <= 200) return '#FFC107';
  if (aqi <= 300) return '#FF5722';
  if (aqi <= 400) return '#F44336';
  return '#B71C1C';
}

function aqiVerdict(aqi) {
  if (aqi <= 50)  return 'Air is Good';
  if (aqi <= 100) return 'Air is Satisfactory';
  if (aqi <= 200) return 'Air is Moderate';
  if (aqi <= 300) return 'Air is Poor';
  if (aqi <= 400) return 'Air is Very Poor';
  return 'Air is Severe';
}

/* ── Parse CPCB API response into station objects ────────────────── */
function parseApiRecords(records) {
  return records
    .filter(r => r.latitude && r.longitude && r.avg_aqi_value)
    .map(r => ({
      city:      r.city || r.station_name || 'Unknown',
      station:   r.station_name || '',
      lat:       parseFloat(r.latitude),
      lng:       parseFloat(r.longitude),
      aqi:       Math.round(parseFloat(r.avg_aqi_value)),
      pollutant: r.prominent_pollutant || '—',
      updated:   r.last_update || r.date || '',
    }))
    .filter(s => !isNaN(s.lat) && !isNaN(s.lng) && !isNaN(s.aqi));
}

/* ── Fetch live CPCB data (all pages) ────────────────────────────── */
async function fetchCPCBData() {
  const params = new URLSearchParams({
    'api-key':  CPCB_API_KEY,
    format:     'json',
    limit:      API_PAGE_LIMIT,
    offset:     0,
  });

  const res = await fetch(`${CPCB_API_URL}?${params}`);
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const json = await res.json();

  let records = json.records || [];

  // Paginate if more records exist
  const total = parseInt(json.total) || records.length;
  if (total > API_PAGE_LIMIT) {
    const pages = Math.ceil(total / API_PAGE_LIMIT);
    const fetches = [];
    for (let p = 1; p < pages; p++) {
      const pg = new URLSearchParams({ 'api-key': CPCB_API_KEY, format: 'json', limit: API_PAGE_LIMIT, offset: p * API_PAGE_LIMIT });
      fetches.push(fetch(`${CPCB_API_URL}?${pg}`).then(r => r.json()).then(j => j.records || []));
    }
    const rest = await Promise.all(fetches);
    rest.forEach(r => records.push(...r));
  }

  return parseApiRecords(records);
}

/* ── Haversine distance (km) ─────────────────────────────────────── */
function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ── Build popup HTML ────────────────────────────────────────────── */
function buildPopupHTML(s) {
  const color   = aqiColor(s.aqi);
  const verdict = aqiVerdict(s.aqi);
  return `
    <div class="popup-city">${s.city}${s.station && s.station !== s.city ? ' · ' + s.station : ''}</div>
    <div class="popup-aqi-row">
      <span class="popup-aqi-val" style="color:${color}">${s.aqi}</span>
      <span class="popup-aqi-label">AQI</span>
    </div>
    <div class="popup-verdict" style="color:${color}">${verdict}</div>
    <div class="popup-meta">
      <span><strong>Pollutant</strong>${s.pollutant}</span>
      ${s.updated ? `<span><strong>Updated</strong>${s.updated}</span>` : ''}
    </div>`;
}

/* ── Update nearest-station card ─────────────────────────────────── */
function updateCard(s) {
  const color = aqiColor(s.aqi);
  document.getElementById('card-city').textContent    = s.station && s.station !== s.city ? `${s.city} · ${s.station}` : s.city;
  document.getElementById('card-aqi').textContent     = s.aqi;
  document.getElementById('card-aqi').style.color     = color;
  document.getElementById('card-verdict').textContent = aqiVerdict(s.aqi);
  document.getElementById('card-verdict').style.color = color;
  document.getElementById('card-pollutant').textContent = s.pollutant ? `Dominant pollutant: ${s.pollutant}` : '';
  document.getElementById('card-updated').textContent   = s.updated ? `Updated ${s.updated}` : '';
  document.getElementById('nearest-card').classList.remove('hidden');
}

    style: {
      version: 8,
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxzoom: 19,
        },
      },
      layers: [
        {
          id: 'osm-tiles',
          type: 'raster',
          source: 'osm',
          paint: {
            /* Darken the base map tiles to match the dark theme */
            'raster-brightness-min': 0,
            'raster-brightness-max': 0.25,
            'raster-saturation': -0.6,
            'raster-contrast': 0.2,
          },
        },
      ],
    },
    center: [82.9, 22.5], // geographic centre of India
    zoom:   4.5,
    minZoom: 3,
    maxZoom: 14,
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: false,
  }), 'top-right');

  /* Fetch data — fall back to demo if no key configured */
  let stations = [];
  const usingDemo = CPCB_API_KEY === 'YOUR_API_KEY_HERE';

  try {
    if (usingDemo) {
      stations = DEMO_STATIONS;
      showBanner('Demo mode: showing sample data. Replace CPCB_API_KEY in vayu/index.html with your data.gov.in API key for live readings.', 'info');
    } else {
      stations = await fetchCPCBData();
      if (stations.length === 0) throw new Error('No records returned by API');
    }
  } catch (err) {
    console.error('CPCB fetch failed:', err);
    stations = DEMO_STATIONS;
    showBanner(`Could not load live data (${err.message}). Showing demo markers.`);
  }

  /* Render markers */
  let nearestStation = null;
  let nearestMarker  = null;

  stations.forEach(s => {
    const el = document.createElement('div');
    el.className = 'aqi-marker';
    el.style.background = aqiColor(s.aqi);
    el.textContent = s.aqi > 999 ? '999+' : s.aqi;

    const popup = new maplibregl.Popup({ offset: 18, closeButton: true, maxWidth: '260px' })
      .setHTML(buildPopupHTML(s));

    const marker = new maplibregl.Marker({ element: el })
      .setLngLat([s.lng, s.lat])
      .setPopup(popup)
      .addTo(map);

    s._marker = marker;
    s._el     = el;
  });

  /* Auto-detect nearest station via Geolocation */
  function findNearest(userLat, userLng) {
    if (stations.length === 0) return;
    let best = null, bestDist = Infinity;
    stations.forEach(s => {
      const d = distKm(userLat, userLng, s.lat, s.lng);
      if (d < bestDist) { bestDist = d; best = s; }
    });
    if (best) {
      nearestStation = best;
      if (nearestMarker) nearestMarker._el && nearestMarker._el.classList.remove('nearest');
      best._el.classList.add('nearest');
      nearestMarker = best;
      updateCard(best);
    }
  }

  /* Try geolocation; fall back to a default nearest pick without it */
  if ('geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition(
      pos  => findNearest(pos.coords.latitude, pos.coords.longitude),
      _err => findNearest(28.6, 77.2), // default: New Delhi area
      { timeout: 5000 }
    );
  } else {
    findNearest(28.6, 77.2);
  }

  /* Hide loading overlay once map tiles start loading */
  map.once('idle', () => {
    const overlay = document.getElementById('loading-overlay');
    overlay.classList.add('fade-out');
    setTimeout(() => overlay.style.display = 'none', 500);
  });

  /* Fallback: hide overlay after 4s regardless */
  setTimeout(() => {
    const overlay = document.getElementById('loading-overlay');
    if (overlay.style.display !== 'none') {
      overlay.classList.add('fade-out');
      setTimeout(() => overlay.style.display = 'none', 500);
    }
  }, 4000);
})();

/* ── Utility: show error/info banner ────────────────────────────── */
function showBanner(msg, type = 'error') {
  const banner = document.getElementById('error-banner');
  banner.textContent = msg;
  banner.style.display = 'block';
  if (type === 'info') {
    banner.style.background = '#1A2E1F';
    banner.style.borderColor = '#2D4A32';
    banner.style.color       = '#7DA882';
  }
  /* Auto-dismiss after 8 seconds */
  setTimeout(() => { banner.style.display = 'none'; }, 8000);
}
</script>
